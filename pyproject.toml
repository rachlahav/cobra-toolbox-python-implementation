[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pscm"
version = "0.0.1"
description = "Python translation of the COBRA Toolbox PSCM (whole-body modelling) and FBA functions, on cobrapy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cobra>=0.29",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
test = ["pytest>=7", "symengine"]  # symengine makes optlang/cobrapy much faster on large models

[tool.setuptools.packages.find]
include = ["pscm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
