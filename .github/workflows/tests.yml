name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          python -c "import cobra, optlang; print('cobra', cobra.__version__, '| solvers', {k for k, v in optlang.available_solvers.items() if v})"

      # Control: the SciPy/HiGHS reference port must always pass. If it fails,
      # the tests or the environment are wrong, not the translation.
      - name: Reference implementation (control)
        env:
          OPTCB_IMPLS: reference
        run: pytest -q tests/test_optimize_cb_model.py

      # The translation, on cobrapy's default solver (GLPK).
      - name: Translation (pscm, GLPK)
        if: always()
        env:
          OPTCB_IMPLS: translation
        run: pytest -q tests/

      # Diagnostic: same tests with OPTCB_TOLERANCE_SHIM=1, which lets solvers
      # without an 'optimality' tolerance (GLPK) accept one. Shows whether the
      # rest of the translation is correct once past that known issue.
      - name: Translation with tolerance shim (diagnostic)
        if: always()
        continue-on-error: true
        env:
          OPTCB_IMPLS: translation
          OPTCB_TOLERANCE_SHIM: "1"
        run: pytest -q tests/

      # Per-test results as annotations (readable in the run summary and the API).
      - name: Annotate results
        if: always() && matrix.python-version == '3.12'
        continue-on-error: true
        run: |
          python -c "import cobra, optlang; print('::notice title=environment::cobra', cobra.__version__, 'optlang', optlang.__version__, 'solvers', sorted(k for k, v in optlang.available_solvers.items() if v))"
          OPTCB_IMPLS=translation,reference python tests/test_optimize_cb_model.py results_glpk > /dev/null 2>&1 || true
          python tools/ci_annotate.py results_glpk.json "GLPK"
          OPTCB_IMPLS=translation OPTCB_TOLERANCE_SHIM=1 python tests/test_optimize_cb_model.py results_shim > /dev/null 2>&1 || true
          python tools/ci_annotate.py results_shim.json "GLPK+shim"

      - name: Benchmark (timings, informational)
        if: always()
        continue-on-error: true
        env:
          OPTCB_IMPLS: reference
        run: python benchmarks/benchmark.py 5 benchmarks/python_results.csv
